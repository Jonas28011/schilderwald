name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen-und-veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vorfahrt-Regeln prüfen
        run: node werkzeuge/vorfahrt-pruefung.cjs
      - name: Service Worker und Artefakt-Fassung neu bauen
        run: node werkzeuge/web-bauen.mjs
      - name: Prüfen, ob sw.js aktuell eingecheckt ist
        run: git diff --exit-code app/sw.js || (echo "app/sw.js ist veraltet – bitte node werkzeuge/web-bauen.mjs laufen lassen und einchecken" && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: veroeffentlichen
        uses: actions/deploy-pages@v4
