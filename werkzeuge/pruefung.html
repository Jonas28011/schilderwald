<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Prüfung</title>
<style>body{margin:0;background:#fff;font:12px sans-serif}#g{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:4px}
.z{display:flex;flex-direction:column;align-items:center;justify-content:end;background:#fff}.z img{max-width:100%;max-height:92px;object-fit:contain}
#nav{position:fixed;right:4px;bottom:4px;background:#ff0;padding:2px 6px}</style></head><body><div id="g"></div><div id="nav"></div>
<script src="/app/bilder.js"></script><script src="/app/inhalte.js"></script>
<script>
const ids = Object.keys(window.BILDMASSE);
const seite = +(location.hash.slice(1) || 0), N = 32;
document.getElementById('g').innerHTML = ids.slice(seite * N, seite * N + N).map(id => `<div class="z"><img src="/app/z/${encodeURIComponent(id)}.png"><span>${id}</span></div>`).join('');
document.getElementById('nav').textContent = `Seite ${seite + 1}/${Math.ceil(ids.length / N)}`;
</script></body></html>
